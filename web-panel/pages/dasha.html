<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета — Даша | First Class</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>:root { --accent: #667eea; --accent-secondary: #764ba2; }</style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">FIRST CLASS</div>
            <div class="tagline">Аудит процессов</div>
        </header>

        <main class="main">
            <div class="form-header">
                <a href="../index.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">← Назад</a>
                <h1 style="margin-top: 15px;">👩‍💼 Анкета: Даша</h1>
                <p>B2C продажи, Instagram, работа с клиентами</p>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 20%"></div>
            </div>
            <div class="progress-text" id="progress-text">Раздел 1 из 5</div>

            <div id="form-container"></div>

            <div class="nav-buttons">
                <button class="btn btn-secondary" id="btn-prev" style="display: none;">← Назад</button>
                <button class="btn btn-primary" id="btn-next">Далее →</button>
            </div>
        </main>

        <footer class="footer">
            <p>🔒 Ваши ответы конфиденциальны</p>
        </footer>
    </div>

    <script src="../js/form.js"></script>
    <script>
        const formConfig = {
            role: 'dasha',
            sections: [
                {
                    title: 'Лиды и клиенты',
                    questions: [
                        {
                            type: 'checkbox',
                            text: 'Откуда приходят ваши клиенты?',
                            options: ['Instagram Direct', 'Instagram комментарии', 'WhatsApp', 'Telegram', 'Звонки', 'Сайт fclass.by', 'Рекомендации']
                        },
                        {
                            type: 'text',
                            text: 'Какой канал приносит БОЛЬШЕ ВСЕГО клиентов?',
                            placeholder: 'Например: Instagram Direct'
                        },
                        {
                            type: 'table',
                            text: 'Сколько новых обращений получаете?',
                            rows: ['В день', 'В неделю', 'В месяц'],
                            placeholder: '___'
                        },
                        {
                            type: 'radio',
                            text: 'Какой % обращений становится бронированиями?',
                            options: ['Менее 10%', '10-20%', '20-30%', '30-50%', 'Более 50%']
                        },
                        {
                            type: 'text',
                            text: 'Сколько туров продаете в месяц (в среднем)?',
                            placeholder: 'Количество...'
                        }
                    ]
                },
                {
                    title: 'Процесс продажи',
                    questions: [
                        {
                            type: 'table',
                            text: 'Какие направления самые популярные?',
                            rows: ['1 место', '2 место', '3 место', '4 место', '5 место'],
                            placeholder: 'Страна'
                        },
                        {
                            type: 'radio',
                            text: 'Какой средний чек на тур (на 2 человек)?',
                            options: ['До $500', '$500-800', '$800-1200', '$1200-2000', 'Более $2000']
                        },
                        {
                            type: 'radio',
                            text: 'Сколько времени от первого контакта до бронирования?',
                            options: ['В тот же день', '1-3 дня', '3-7 дней', '1-2 недели', 'Более 2 недель']
                        },
                        {
                            type: 'textarea',
                            text: 'Какие вопросы клиенты задают чаще всего? (топ-3)',
                            placeholder: '1. ...\n2. ...\n3. ...'
                        }
                    ]
                },
                {
                    title: 'Инструменты',
                    questions: [
                        {
                            type: 'checkbox',
                            text: 'Какие инструменты используете для работы?',
                            options: ['Union', 'Instagram', 'WhatsApp', 'Telegram', 'Excel/Google Sheets', 'Google Календарь', 'Заметки на телефоне', 'CRM']
                        },
                        {
                            type: 'radio',
                            text: 'Где храните контакты клиентов?',
                            options: ['В телефоне', 'В Excel/Google Sheets', 'В CRM', 'В Instagram переписке', 'Нигде систематически']
                        },
                        {
                            type: 'radio',
                            text: 'Используете ли шаблоны сообщений?',
                            options: ['Да, активно', 'Иногда', 'Нет, пишу вручную']
                        }
                    ]
                },
                {
                    title: 'Боли и проблемы',
                    questions: [
                        {
                            type: 'table',
                            text: 'На что уходит больше всего времени?',
                            rows: ['Ответы на сообщения', 'Поиск туров', 'Оформление документов', 'Созвоны/встречи', 'Контент для Instagram'],
                            placeholder: 'часов/день'
                        },
                        {
                            type: 'radio',
                            text: 'Теряете ли клиентов из-за долгого ответа?',
                            options: ['Да, часто', 'Иногда', 'Редко', 'Нет']
                        },
                        {
                            type: 'textarea',
                            text: 'Какие задачи хотели бы автоматизировать?',
                            placeholder: 'Что отнимает время и хотелось бы делать быстрее...'
                        },
                        {
                            type: 'textarea',
                            text: 'Что раздражает в текущих процессах?',
                            placeholder: 'Что мешает работать эффективнее...'
                        }
                    ]
                },
                {
                    title: 'Instagram и цели',
                    questions: [
                        {
                            type: 'text',
                            text: 'Сколько подписчиков у аккаунта?',
                            placeholder: 'Количество...'
                        },
                        {
                            type: 'radio',
                            text: 'Сколько времени в день уходит на Instagram?',
                            options: ['Менее 1 часа', '1-2 часа', '2-4 часа', 'Более 4 часов']
                        },
                        {
                            type: 'radio',
                            text: 'Какой % клиентов возвращается повторно?',
                            options: ['Менее 10%', '10-20%', '20-30%', '30-50%', 'Более 50%']
                        },
                        {
                            type: 'textarea',
                            text: 'Что мешает расти прямо сейчас?',
                            placeholder: 'Главные ограничения...'
                        }
                    ]
                }
            ]
        };

        new AuditForm(formConfig);
    </script>
</body>
</html>
