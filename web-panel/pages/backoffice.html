<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета — Бэкофис | First Class</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>:root { --accent: #4776E6; --accent-secondary: #8E54E9; }</style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">FIRST CLASS</div>
            <div class="tagline">Аудит процессов</div>
        </header>

        <main class="main">
            <div class="form-header">
                <a href="../index.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">← Назад</a>
                <h1 style="margin-top: 15px;">📋 Анкета: Бэкофис</h1>
                <p>Документооборот и работа с заявками</p>
            </div>

            <div class="info-box" style="margin-bottom: 25px; background: rgba(71, 118, 230, 0.15);">
                <div class="info-icon">⭐</div>
                <div class="info-text">
                    <strong>Ключевая анкета</strong>
                    <span>Ваши ответы напрямую влияют на автоматизацию процессов</span>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 25%"></div>
            </div>
            <div class="progress-text" id="progress-text">Раздел 1 из 7</div>

            <div id="form-container"></div>

            <div class="nav-buttons">
                <button class="btn btn-secondary" id="btn-prev" style="display: none;">← Назад</button>
                <button class="btn btn-primary" id="btn-next">Далее →</button>
            </div>
        </main>

        <footer class="footer">
            <p>🔒 Ваши ответы конфиденциальны</p>
        </footer>
    </div>

    <script src="../js/form.js"></script>
    <script>
        const formConfig = {
            role: 'backoffice',
            sections: [
                {
                    title: 'О вас',
                    questions: [
                        {
                            type: 'text',
                            text: 'Ваше имя',
                            placeholder: 'Как вас зовут...'
                        },
                        {
                            type: 'radio',
                            text: 'Сколько лет работаете в First Class?',
                            options: ['Менее 1 года', '1-2 года', '2-5 лет', 'Более 5 лет']
                        }
                    ]
                },
                {
                    title: 'Ваши задачи',
                    questions: [
                        {
                            type: 'checkbox',
                            text: 'Чем вы занимаетесь? (выберите всё, что делаете)',
                            options: [
                                'Оформление туров',
                                'Подготовка документов для клиентов',
                                'Работа с туроператорами',
                                'Бронирование отелей/авиа',
                                'Передача данных в бухгалтерию',
                                'Звонки клиентам',
                                'Ответы на email/сообщения',
                                'Работа с визами',
                                'Оформление страховок',
                                'Отчеты и статистика',
                                'Помощь менеджерам (Даша/Паша)',
                                'Решение проблем/срочные вопросы'
                            ]
                        },
                        {
                            type: 'textarea',
                            text: 'Какие ещё задачи выполняете, которых нет в списке?',
                            placeholder: 'Опишите другие обязанности...'
                        },
                        {
                            type: 'table',
                            text: 'Сколько времени уходит на каждую задачу? (примерно)',
                            rows: [
                                'Работа в системе',
                                'Документы для клиентов',
                                'Работа с туроператорами',
                                'Передача в бухгалтерию',
                                'Звонки/переписка',
                                'Визы и страховки',
                                'Решение проблем',
                                'Другое'
                            ],
                            placeholder: '% времени'
                        }
                    ]
                },
                {
                    title: 'Объем работы',
                    questions: [
                        {
                            type: 'text',
                            text: 'Сколько заявок обрабатываете в месяц?',
                            placeholder: 'Количество...'
                        },
                        {
                            type: 'radio',
                            text: 'Сколько заявок в день (в среднем)?',
                            options: ['Менее 5', '5-10', '10-20', '20-30', 'Более 30']
                        },
                        {
                            type: 'radio',
                            text: 'Сколько времени занимает одна заявка?',
                            options: ['До 15 минут', '15-30 минут', '30-60 минут', 'Более 1 часа']
                        }
                    ]
                },
                {
                    title: 'Рабочие системы',
                    questions: [
                        {
                            type: 'checkbox',
                            text: 'Какие функции используете в рабочей системе?',
                            options: ['Бронирование туров', 'Работа с клиентами', 'Документооборот', 'Отчеты', 'Финансы', 'Справочники']
                        },
                        {
                            type: 'table',
                            text: 'Какие операции выполняете чаще всего?',
                            rows: ['Создание заявки', 'Редактирование', 'Печать документов', 'Поиск по базе', 'Отчеты'],
                            placeholder: 'раз/день'
                        },
                        {
                            type: 'checkbox',
                            text: 'Какие документы формируете?',
                            options: ['Договор с клиентом', 'Счет на оплату', 'Акт выполненных работ', 'Ваучер', 'Путевка']
                        },
                        {
                            type: 'textarea',
                            text: 'Что НЕ получается делать в текущей системе?',
                            placeholder: 'Ограничения системы...'
                        }
                    ]
                },
                {
                    title: 'Передача данных в 1С ⭐',
                    questions: [
                        {
                            type: 'checkbox',
                            text: 'Какие данные передаете в бухгалтерию?',
                            options: ['Данные о клиенте', 'Сумма сделки', 'Даты тура', 'Информация о туре', 'Документы (сканы)']
                        },
                        {
                            type: 'radio',
                            text: 'КАК передаете данные в 1С?',
                            options: ['Вручную в Excel', 'По email', 'Бумажные документы', 'Через общую папку', 'Бухгалтер смотрит в системе']
                        },
                        {
                            type: 'radio',
                            text: 'Как ЧАСТО передаете данные?',
                            options: ['После каждой сделки', 'Раз в день', 'Раз в неделю', 'По запросу', 'В конце месяца']
                        },
                        {
                            type: 'table',
                            text: 'Сколько времени уходит на передачу?',
                            rows: ['В день', 'В неделю', 'В конце месяца'],
                            placeholder: 'часов'
                        },
                        {
                            type: 'checkbox',
                            text: 'Какие проблемы при передаче?',
                            options: ['Ошибки при вводе', 'Долго', 'Путаница в документах', 'Расхождения данных', 'Бухгалтер требует доп. инфо']
                        }
                    ]
                },
                {
                    title: 'Типичный день',
                    questions: [
                        {
                            type: 'textarea',
                            text: 'Опишите свой типичный рабочий день (с чего начинаете, что делаете, чем заканчиваете)',
                            placeholder: '9:00 — прихожу, проверяю...\n10:00 — ...\n...'
                        },
                        {
                            type: 'radio',
                            text: 'Как часто вас отвлекают от текущей задачи?',
                            options: ['Постоянно', 'Часто (каждый час)', 'Иногда (пару раз в день)', 'Редко']
                        },
                        {
                            type: 'checkbox',
                            text: 'Кто чаще всего обращается к вам?',
                            options: ['Даша', 'Паша', 'Надя', 'Клиенты напрямую', 'Туроператоры']
                        },
                        {
                            type: 'textarea',
                            text: 'Какие задачи чаще всего "горят" и требуют срочного внимания?',
                            placeholder: 'Что приходится бросать всё и делать...'
                        }
                    ]
                },
                {
                    title: 'Боли и желания',
                    questions: [
                        {
                            type: 'textarea',
                            text: 'Что больше всего раздражает / отнимает силы в работе?',
                            placeholder: 'Честно, что бесит...'
                        },
                        {
                            type: 'checkbox',
                            text: 'Какие проблемы возникают чаще всего?',
                            options: [
                                'Ошибки в данных',
                                'Нехватка информации от менеджеров',
                                'Срочные задачи ломают план',
                                'Дублирование работы',
                                'Сложный интерфейс системы',
                                'Проблемы с туроператорами',
                                'Претензии клиентов'
                            ]
                        },
                        {
                            type: 'textarea',
                            text: 'Какие задачи делаете ВРУЧНУЮ, хотя можно было бы автоматизировать?',
                            placeholder: 'Копирование данных, повторяющиеся действия...'
                        },
                        {
                            type: 'textarea',
                            text: 'Что бы вы изменили в работе, если бы могли?',
                            placeholder: 'Любые идеи и пожелания...'
                        },
                        {
                            type: 'radio',
                            text: 'Готовы к 15-минутному созвону для уточнения?',
                            options: ['Да', 'Возможно', 'Лучше по переписке', 'Нет']
                        }
                    ]
                }
            ]
        };

        new AuditForm(formConfig);
    </script>
</body>
</html>
