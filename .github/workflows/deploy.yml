name: Deploy to fclass.by

# Этот workflow заменяет сломанный fclass-ftp-sync (sandbox blocked).
# Триггерится на push в main → автодеплой на ISPmanager FTP.
# Загрузка: параллельный curl (--ftp-create-dirs) вместо lftp single-session,
# который стабильно зависал на пачках файлов (max-retries exceeded).

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск из Actions UI

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: FTP Sync (parallel curl)
        timeout-minutes: 20
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          is_public_file() {
            local f="$1"
            local base
            [ -f "$f" ] || return 1
            base="$(basename "$f")"

            case "$f" in
              ./.git/*|./.github/*|./node_modules/*|./.claude/*|./api/*|./docs/*|./web-panel/*|./questionnaires/*|./content/*|./scripts/*|./n8n/*|./n8n-workflows/*|./data/*|./fclass-landing/*|./demo-carousel-phuket/*)
                return 1
                ;;
              ./blog/_template.html|./firstclass-growth-playbook.html|./firstclass-gtm-plan.html)
                return 1
                ;;
            esac

            case "$base" in
              .env|.env.*|.DS_Store|.gitignore|.claudeignore|.mcp.json|*.md|package.json|package-lock.json|vercel.json|robots-vercel.txt)
                return 1
                ;;
            esac

            return 0
          }

          files=()
          candidates=()
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && \
             [ -n "${BEFORE_SHA:-}" ] && \
             [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -d '' candidates < <(git diff --name-only -z --diff-filter=ACMRT "${BEFORE_SHA}" "${AFTER_SHA}" --)
            echo "Changed files in push: ${#candidates[@]}"
            for f in "${candidates[@]}"; do
              f="./${f}"
              if is_public_file "$f"; then
                files+=("$f")
              fi
            done
          fi

          if [ "${#files[@]}" -eq 0 ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "No public files changed in this push; nothing to deploy."
            exit 0
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Manual dispatch / no diff → full public upload."
            mapfile -d '' files < <(
              find . \
                \( -path './.git' -o -path './.github' -o -path './node_modules' -o -path './.claude' -o -path './api' -o -path './docs' -o -path './web-panel' -o -path './questionnaires' -o -path './content' -o -path './scripts' -o -path './n8n' -o -path './n8n-workflows' -o -path './data' -o -path './fclass-landing' -o -path './demo-carousel-phuket' \) -prune -o \
                -type f \
                ! -name '.env' \
                ! -name '.env.*' \
                ! -name '.DS_Store' \
                ! -name '.gitignore' \
                ! -name '.claudeignore' \
                ! -name '.mcp.json' \
                ! -name '*.md' \
                ! -name 'package.json' \
                ! -name 'package-lock.json' \
                ! -name 'vercel.json' \
                ! -name 'robots-vercel.txt' \
                ! -name 'firstclass-growth-playbook.html' \
                ! -name 'firstclass-gtm-plan.html' \
                ! -path './blog/_template.html' \
                -print0
            )
          else
            echo "Incremental public upload files: ${#files[@]}"
          fi
          echo "Files to upload: ${#files[@]}"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nothing to upload."
            exit 0
          fi

          # Normalize host: strip any scheme/trailing slash.
          host="${FTP_HOST#ftp://}"; host="${host#ftps://}"; host="${host%/}"
          export CURL_HOST="$host" FTP_USERNAME FTP_PASSWORD

          # Per-file uploader. --ftp-create-dirs makes remote dirs as needed.
          # --disable-epsv forces classic PASV (ActiveCloud FTP stalls on EPSV).
          # --retry handles the intermittent single-file stalls that killed lftp.
          upload_one() {
            local f="$1"
            local remote="${f#./}"
            if curl -sS --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
                 --connect-timeout 12 --max-time 45 --retry 2 --retry-delay 2 \
                 -T "$f" "ftp://${CURL_HOST}/${remote}" \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 -o /dev/null 2>/dev/null; then
              echo "OK   ${remote}"
            else
              echo "FAIL ${remote}"
            fi
          }
          export -f upload_one

          echo "Uploading ${#files[@]} files via parallel curl (4 workers)…"
          printf '%s\0' "${files[@]}" | xargs -0 -P 4 -I{} bash -c 'upload_one "$@"' _ {} | tee /tmp/upload.log

          # Second pass for any stragglers (FTP flake), sequential.
          fails=$(grep -c '^FAIL' /tmp/upload.log || true)
          if [ "${fails:-0}" -gt 0 ]; then
            echo "Retrying ${fails} failed file(s) sequentially…"
            grep '^FAIL' /tmp/upload.log | sed 's/^FAIL //' | while IFS= read -r remote; do
              upload_one "./${remote}"
            done | tee /tmp/upload2.log
            fails=$(grep -c '^FAIL' /tmp/upload2.log || true)
          fi

          echo "Done. Remaining failures after retry: ${fails:-0}"
          # Do not hard-fail on individual FTP flake; the Verify step below
          # fails the job if any key public URL is not 200.

      - name: Verify deploy
        run: |
          echo "Deploy completed at $(date -u)"
          fail=0
          echo "Verifying live URLs..."
          for path in "/" "/komandirovochnye-kalkulyator/" "/tickets/" "/tickets/direct-flights/" "/tickets/aviabilety-dlya-yurlic/" "/tickets/minsk-kaliningrad/" "/tickets/minsk-sochi/" "/tickets/minsk-baku/" "/tickets/minsk-sharm-el-sheikh/" "/komandirovki/" "/komandirovki-na-vystavki/" "/privacy/" "/sitemap.xml"; do
            STATUS=$(curl -sS -L --max-time 30 -o /dev/null -w "%{http_code}" "https://fclass.by${path}" || echo "000")
            echo "  ${path} -> HTTP ${STATUS}"
            if [ "$STATUS" != "200" ]; then fail=1; fi
          done

          echo "Verifying internal URLs are blocked..."
          for path in "/api/lead-magnet.php" "/docs/audit/dashboard.html" "/web-panel/" "/questionnaires/pdf/pasha_b2b.html" "/fclass-landing/blog/index.html" "/n8n-workflows/lp-lead.workflow.json" "/blog/_template.html" "/firstclass-growth-playbook.html"; do
            STATUS=$(curl -sS -L --max-time 30 -o /dev/null -w "%{http_code}" "https://fclass.by${path}" || echo "000")
            echo "  ${path} -> HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then fail=1; fi
          done

          exit "$fail"
