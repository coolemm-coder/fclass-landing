name: Deploy to fclass.by

# Этот workflow заменяет сломанный fclass-ftp-sync (sandbox blocked).
# Триггерится на push в main → автодеплой на ISPmanager FTP.

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск из Actions UI

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTP Sync (lftp, single session)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find . \
              \( -path './.git' -o -path './.github' -o -path './node_modules' -o -path './.claude' -o -path './api' -o -path './docs' -o -path './web-panel' -o -path './questionnaires' -o -path './content' -o -path './scripts' -o -path './n8n' -o -path './n8n-workflows' -o -path './data' -o -path './fclass-landing' \) -prune -o \
              -type f \
              ! -name '.env' \
              ! -name '.env.*' \
              ! -name '.DS_Store' \
              ! -name '.gitignore' \
              ! -name '.claudeignore' \
              ! -name '.mcp.json' \
              ! -name '*.md' \
              ! -name 'package.json' \
              ! -name 'package-lock.json' \
              ! -name 'vercel.json' \
              ! -name 'robots-vercel.txt' \
              ! -name 'firstclass-growth-playbook.html' \
              ! -name 'firstclass-gtm-plan.html' \
              ! -path './blog/_template.html' \
              -print0
          )
          echo "Files to upload: ${#files[@]}"

          declare -A dirs_made=()
          script="/tmp/lftp.cmd"
          {
            echo "set ftp:passive-mode on"
            echo "set ftp:ssl-allow no"
            echo "set net:max-retries 8"
            echo "set net:reconnect-interval-base 5"
            echo "set net:reconnect-interval-multiplier 1.5"
            echo "set net:reconnect-interval-max 30"
            echo "set net:timeout 30"
            echo "set net:idle 30"
            echo "set xfer:clobber on"
            echo "set mirror:set-permissions no"
            echo "set cmd:fail-exit on"
            echo "open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_HOST}\""
            for f in "${files[@]}"; do
              remote="${f#./}"
              dir="$(dirname "$remote")"
              base="$(basename "$remote")"
              if [ "$dir" != "." ] && [ -z "${dirs_made[$dir]:-}" ]; then
                echo "mkdir -fp \"${dir}\""
                dirs_made[$dir]=1
              fi
              if [ "$dir" = "." ]; then
                echo "put \"${f}\" -o \"${base}\""
              else
                echo "put \"${f}\" -o \"${dir}/${base}\""
              fi
            done
            echo "bye"
          } > "$script"

          # Hide credentials from logs even though GH masks them.
          echo "Running lftp ($(wc -l < "$script") commands)…"
          lftp -f "$script"
          echo "Uploaded ${#files[@]} files via lftp"

      - name: Verify deploy
        run: |
          echo "Deploy completed at $(date -u)"
          echo "Verifying live URLs..."
          for path in "/" "/komandirovochnye-kalkulyator/" "/tickets/" "/tickets/direct-flights/" "/tickets/aviabilety-dlya-yurlic/" "/tickets/minsk-kaliningrad/" "/tickets/minsk-sochi/" "/tickets/minsk-baku/" "/tickets/minsk-sharm-el-sheikh/" "/komandirovki/" "/komandirovki-na-vystavki/" "/privacy/" "/sitemap.xml"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://fclass.by${path}")
            echo "  ${path} -> HTTP ${STATUS}"
          done

          echo "Verifying internal URLs are blocked..."
          for path in "/api/lead-magnet.php" "/docs/audit/dashboard.html" "/web-panel/" "/questionnaires/pdf/pasha_b2b.html" "/fclass-landing/blog/index.html" "/n8n-workflows/lp-lead.workflow.json" "/blog/_template.html" "/firstclass-growth-playbook.html"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://fclass.by${path}")
            echo "  ${path} -> HTTP ${STATUS}"
          done
