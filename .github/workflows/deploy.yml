name: Deploy to fclass.by

# Этот workflow заменяет сломанный fclass-ftp-sync (sandbox blocked).
# Триггерится на push в main → автодеплой на ISPmanager FTP за ~30 секунд.

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск из Actions UI

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Sync
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          log-level: standard
          dry-run: false
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github/**/*
            **/node_modules/**
            **/.env
            **/.env.*
            **/.DS_Store
            **/.claude/**
            **/.claude/**/*
            **/.claudeignore
            **/.mcp.json
            **/api/**
            **/api/**/*
            **/docs/**
            **/docs/**/*
            **/web-panel/**
            **/web-panel/**/*
            **/questionnaires/**
            **/questionnaires/**/*
            **/content/**
            **/content/**/*
            **/scripts/**
            **/scripts/**/*
            **/n8n/**
            **/n8n/**/*
            **/n8n-workflows/**
            **/n8n-workflows/**/*
            **/data/**
            **/data/**/*
            **/fclass-landing/**
            **/fclass-landing/**/*
            **/blog/_template.html
            **/*.md
            **/package.json
            **/package-lock.json
            **/vercel.json
            **/robots-vercel.txt
            **/firstclass-growth-playbook.html
            **/firstclass-gtm-plan.html
            **/CLAUDE.md
            **/README.md
            **/PROJECT_LOG.md
            **/ROADMAP.md
            **/VISION.md
            **/.ftp-deploy-sync-state.json

      - name: Verify deploy
        run: |
          echo "Deploy completed at $(date -u)"
          echo "Verifying live URLs..."
          for path in "/" "/komandirovochnye-kalkulyator/" "/tickets/" "/tickets/direct-flights/" "/tickets/aviabilety-dlya-yurlic/" "/komandirovki/" "/sitemap.xml"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://fclass.by${path}")
            echo "  ${path} -> HTTP ${STATUS}"
          done

          echo "Verifying internal URLs are blocked..."
          for path in "/api/lead-magnet.php" "/docs/audit/dashboard.html" "/web-panel/" "/questionnaires/pdf/pasha_b2b.html" "/fclass-landing/blog/index.html" "/n8n-workflows/lp-lead.workflow.json" "/blog/_template.html" "/firstclass-growth-playbook.html"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://fclass.by${path}")
            echo "  ${path} -> HTTP ${STATUS}"
          done
