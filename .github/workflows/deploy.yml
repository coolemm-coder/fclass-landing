name: Deploy to fclass.by

# Этот workflow заменяет сломанный fclass-ftp-sync (sandbox blocked).
# Триггерится на push в main → автодеплой на ISPmanager FTP.

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск из Actions UI

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Sync
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          upload_count=0
          while IFS= read -r -d '' file; do
            remote="${file#./}"
            echo "Uploading ${remote}"
            curl --fail --silent --show-error --ftp-create-dirs --connect-timeout 20 --max-time 120 --retry 2 --retry-delay 3 -T "$file" "ftp://${FTP_HOST}/${remote}" --user "${FTP_USERNAME}:${FTP_PASSWORD}"
            upload_count=$((upload_count + 1))
          done < <(
            find . \
              \( -path './.git' -o -path './.github' -o -path './node_modules' -o -path './.claude' -o -path './api' -o -path './docs' -o -path './web-panel' -o -path './questionnaires' -o -path './content' -o -path './scripts' -o -path './n8n' -o -path './n8n-workflows' -o -path './data' -o -path './fclass-landing' \) -prune -o \
              -type f \
              ! -name '.env' \
              ! -name '.env.*' \
              ! -name '.DS_Store' \
              ! -name '.gitignore' \
              ! -name '.claudeignore' \
              ! -name '.mcp.json' \
              ! -name '*.md' \
              ! -name 'package.json' \
              ! -name 'package-lock.json' \
              ! -name 'vercel.json' \
              ! -name 'robots-vercel.txt' \
              ! -name 'firstclass-growth-playbook.html' \
              ! -name 'firstclass-gtm-plan.html' \
              ! -path './blog/_template.html' \
              -print0
          )
          echo "Uploaded ${upload_count} files"

      - name: Verify deploy
        run: |
          echo "Deploy completed at $(date -u)"
          echo "Verifying live URLs..."
          for path in "/" "/komandirovochnye-kalkulyator/" "/tickets/" "/tickets/direct-flights/" "/tickets/aviabilety-dlya-yurlic/" "/tickets/minsk-kaliningrad/" "/tickets/minsk-sochi/" "/tickets/minsk-baku/" "/tickets/minsk-sharm-el-sheikh/" "/komandirovki/" "/privacy/" "/sitemap.xml"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://fclass.by${path}")
            echo "  ${path} -> HTTP ${STATUS}"
          done

          echo "Verifying internal URLs are blocked..."
          for path in "/api/lead-magnet.php" "/docs/audit/dashboard.html" "/web-panel/" "/questionnaires/pdf/pasha_b2b.html" "/fclass-landing/blog/index.html" "/n8n-workflows/lp-lead.workflow.json" "/blog/_template.html" "/firstclass-growth-playbook.html"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://fclass.by${path}")
            echo "  ${path} -> HTTP ${STATUS}"
          done
