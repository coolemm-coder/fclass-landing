name: Deploy to fclass.by

# Этот workflow заменяет сломанный fclass-ftp-sync (sandbox blocked).
# Триггерится на push в main → автодеплой на ISPmanager FTP.

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск из Actions UI

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: FTP Sync
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 5; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_HOST\"; mirror -R --verbose=2 --only-newer --parallel=2 --exclude-glob .git/ --exclude-glob .git/** --exclude-glob .github/ --exclude-glob .github/** --exclude-glob node_modules/ --exclude-glob node_modules/** --exclude-glob .env --exclude-glob .env.* --exclude-glob .DS_Store --exclude-glob .claude/ --exclude-glob .claude/** --exclude-glob .claudeignore --exclude-glob .mcp.json --exclude-glob api/ --exclude-glob api/** --exclude-glob docs/ --exclude-glob docs/** --exclude-glob web-panel/ --exclude-glob web-panel/** --exclude-glob questionnaires/ --exclude-glob questionnaires/** --exclude-glob content/ --exclude-glob content/** --exclude-glob scripts/ --exclude-glob scripts/** --exclude-glob n8n/ --exclude-glob n8n/** --exclude-glob n8n-workflows/ --exclude-glob n8n-workflows/** --exclude-glob data/ --exclude-glob data/** --exclude-glob fclass-landing/ --exclude-glob fclass-landing/** --exclude-glob blog/_template.html --exclude-glob '*.md' --exclude-glob package.json --exclude-glob package-lock.json --exclude-glob vercel.json --exclude-glob robots-vercel.txt --exclude-glob firstclass-growth-playbook.html --exclude-glob firstclass-gtm-plan.html --exclude-glob CLAUDE.md --exclude-glob README.md --exclude-glob PROJECT_LOG.md --exclude-glob ROADMAP.md --exclude-glob VISION.md ./ ./"

      - name: Verify deploy
        run: |
          echo "Deploy completed at $(date -u)"
          echo "Verifying live URLs..."
          for path in "/" "/komandirovochnye-kalkulyator/" "/tickets/" "/tickets/direct-flights/" "/tickets/aviabilety-dlya-yurlic/" "/tickets/minsk-kaliningrad/" "/tickets/minsk-sochi/" "/tickets/minsk-baku/" "/tickets/minsk-sharm-el-sheikh/" "/komandirovki/" "/privacy/" "/sitemap.xml"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://fclass.by${path}")
            echo "  ${path} -> HTTP ${STATUS}"
          done

          echo "Verifying internal URLs are blocked..."
          for path in "/api/lead-magnet.php" "/docs/audit/dashboard.html" "/web-panel/" "/questionnaires/pdf/pasha_b2b.html" "/fclass-landing/blog/index.html" "/n8n-workflows/lp-lead.workflow.json" "/blog/_template.html" "/firstclass-growth-playbook.html"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://fclass.by${path}")
            echo "  ${path} -> HTTP ${STATUS}"
          done
