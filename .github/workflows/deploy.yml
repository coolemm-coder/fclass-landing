name: Deploy to fclass.by

# Этот workflow заменяет сломанный fclass-ftp-sync (sandbox blocked).
# Триггерится на push в main → автодеплой на ISPmanager FTP.

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск из Actions UI

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTP Sync (lftp, single session)
        timeout-minutes: 20
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          is_public_file() {
            local f="$1"
            local base
            [ -f "$f" ] || return 1
            base="$(basename "$f")"

            case "$f" in
              ./.git/*|./.github/*|./node_modules/*|./.claude/*|./api/*|./docs/*|./web-panel/*|./questionnaires/*|./content/*|./scripts/*|./n8n/*|./n8n-workflows/*|./data/*|./fclass-landing/*|./demo-carousel-phuket/*)
                return 1
                ;;
              ./blog/_template.html|./firstclass-growth-playbook.html|./firstclass-gtm-plan.html)
                return 1
                ;;
            esac

            case "$base" in
              .env|.env.*|.DS_Store|.gitignore|.claudeignore|.mcp.json|*.md|package.json|package-lock.json|vercel.json|robots-vercel.txt)
                return 1
                ;;
            esac

            return 0
          }

          files=()
          candidates=()
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && \
             [ -n "${BEFORE_SHA:-}" ] && \
             [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -d '' candidates < <(git diff --name-only -z --diff-filter=ACMRT "${BEFORE_SHA}" "${AFTER_SHA}" --)
            echo "Changed files in push: ${#candidates[@]}"
            for f in "${candidates[@]}"; do
              f="./${f}"
              if is_public_file "$f"; then
                files+=("$f")
              fi
            done
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No public changed files detected; falling back to full public upload."
            mapfile -d '' files < <(
              find . \
                \( -path './.git' -o -path './.github' -o -path './node_modules' -o -path './.claude' -o -path './api' -o -path './docs' -o -path './web-panel' -o -path './questionnaires' -o -path './content' -o -path './scripts' -o -path './n8n' -o -path './n8n-workflows' -o -path './data' -o -path './fclass-landing' -o -path './demo-carousel-phuket' \) -prune -o \
                -type f \
                ! -name '.env' \
                ! -name '.env.*' \
                ! -name '.DS_Store' \
                ! -name '.gitignore' \
                ! -name '.claudeignore' \
                ! -name '.mcp.json' \
                ! -name '*.md' \
                ! -name 'package.json' \
                ! -name 'package-lock.json' \
                ! -name 'vercel.json' \
                ! -name 'robots-vercel.txt' \
                ! -name 'firstclass-growth-playbook.html' \
                ! -name 'firstclass-gtm-plan.html' \
                ! -path './blog/_template.html' \
                -print0
            )
          else
            echo "Incremental public upload files: ${#files[@]}"
          fi
          echo "Files to upload: ${#files[@]}"

          declare -A dirs_made=()
          script="/tmp/lftp.cmd"
          {
            echo "set ftp:passive-mode on"
            echo "set ftp:ssl-allow no"
            echo "set net:max-retries 3"
            echo "set net:reconnect-interval-base 3"
            echo "set net:reconnect-interval-multiplier 1.5"
            echo "set net:reconnect-interval-max 8"
            echo "set net:timeout 15"
            echo "set net:idle 15"
            echo "set xfer:clobber on"
            echo "set mirror:set-permissions no"
            # ActiveCloud FTP intermittently stalls on a RANDOM file (max-retries
            # exceeded) and killed the whole 27-min deploy under fail-exit yes.
            # fail-exit no = skip the stalled file, upload the rest; the Verify
            # step below still fails the job if any key public URL is not 200.
            echo "set cmd:fail-exit no"
            echo "open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_HOST}\""
            for f in "${files[@]}"; do
              remote="${f#./}"
              dir="$(dirname "$remote")"
              base="$(basename "$remote")"
              if [ "$dir" != "." ] && [ -z "${dirs_made[$dir]:-}" ]; then
                echo "mkdir -fp \"${dir}\""
                dirs_made[$dir]=1
              fi
              if [ "$dir" = "." ]; then
                echo "put \"${f}\" -o \"${base}\""
              else
                echo "put \"${f}\" -o \"${dir}/${base}\""
              fi
            done
            echo "bye"
          } > "$script"

          # Hide credentials from logs even though GH masks them.
          echo "Running lftp ($(wc -l < "$script") commands)…"
          lftp -f "$script"
          echo "Uploaded ${#files[@]} files via lftp"

      - name: Verify deploy
        run: |
          echo "Deploy completed at $(date -u)"
          fail=0
          echo "Verifying live URLs..."
          for path in "/" "/komandirovochnye-kalkulyator/" "/tickets/" "/tickets/direct-flights/" "/tickets/aviabilety-dlya-yurlic/" "/tickets/minsk-kaliningrad/" "/tickets/minsk-sochi/" "/tickets/minsk-baku/" "/tickets/minsk-sharm-el-sheikh/" "/komandirovki/" "/komandirovki-na-vystavki/" "/privacy/" "/sitemap.xml"; do
            STATUS=$(curl -sS -L --max-time 30 -o /dev/null -w "%{http_code}" "https://fclass.by${path}" || echo "000")
            echo "  ${path} -> HTTP ${STATUS}"
            if [ "$STATUS" != "200" ]; then fail=1; fi
          done

          echo "Verifying internal URLs are blocked..."
          for path in "/api/lead-magnet.php" "/docs/audit/dashboard.html" "/web-panel/" "/questionnaires/pdf/pasha_b2b.html" "/fclass-landing/blog/index.html" "/n8n-workflows/lp-lead.workflow.json" "/blog/_template.html" "/firstclass-growth-playbook.html"; do
            STATUS=$(curl -sS -L --max-time 30 -o /dev/null -w "%{http_code}" "https://fclass.by${path}" || echo "000")
            echo "  ${path} -> HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then fail=1; fi
          done

          exit "$fail"
